<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, #003399de 0%, #ffe100 150%);
            color: #1a1a1a;
        }

        /* Cores BB (Azul e Amarelo) */

        .main-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
        }

        @media (min-width: 1024px) {
            .main-layout {
                flex-direction: row;
            }

            .main-content {
                flex: 1;
                min-height: 100vh;
            }

            .sidebar {
                width: 350px;
                flex-shrink: 0;
                height: 100vh;
                overflow-y: auto;
                position: sticky;
                top: 0;
                border-left: 1px solid rgba(0, 0, 0, 0.1);
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(10px);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Botões de Resposta (A-E) */
        .answer-btn {
            background-color: #f3f4f6;
            border: 2px solid #e5e7eb;
            color: #374151;
            font-weight: bold;
            transition: all 0.2s;
        }

        .answer-btn:hover:not(:disabled) {
            background-color: #dbeafe;
            border-color: #3b82f6;
            color: #1d4ed8;
        }

        .answer-btn.selected {
            background-color: #2563eb;
            color: white;
            border-color: #1d4ed8;
        }

        /* Feedback */
        .answered .answer-btn:not(.selected):not(.correct-answer) {
            opacity: 0.5;
        }

        .answered .answer-btn.correct-answer {
            background-color: #059669;
            color: white;
            border-color: #047857;
        }

        /* Verde */
        .answered .answer-btn.selected.incorrect-answer {
            background-color: #dc2626;
            color: white;
            border-color: #b91c1c;
            text-decoration: line-through;
        }

        /* Vermelho */

        .question-text {
            white-space: pre-wrap;
        }

        /* Mantém quebras de linha do texto original */
    </style>
</head>

    <script>
        // GABARITO 1 - Extraído do PDF fornecido
        // Formato: { id: numero, text: "Enunciado + Alternativas", answer: "Letra Correta" }
        const questions = [
            // LÍNGUA PORTUGUESA
            { id: 1, answer: "A", text: "1. O trecho do texto que resume o objetivo do \"empreendedorismo social\" é\n\n(A) \"A meta é transformar uma realidade, promover o bem-estar da sociedade e agregar valor com cunho social\". (parágrafo 1)\n(B) \"os empreendimentos sociais analisam seu desempenho a partir do impacto social gerado por sua atuação\". (parágrafo 2)\n(C) \"ser inovadora; realizável; autossustentável; contar com a participação de diversos segmentos da sociedade\". (parágrafo 4)\n(D) \"Quem tem interesse de atuar nessa área precisa trabalhar em grupo e formar parcerias\". (parágrafo 5)\n(E) \"o profissional precisa ter flexibilidade e vontade de explorar, pois é possível que ele acabe exercendo um papel que não seja necessariamente na sua área de formação\". (parágrafo 6)" },
            { id: 2, answer: "E", text: "2. O texto explica que o empreendedorismo social se diferencia do conceito de negócio social porque o primeiro procura\n\n(A) criar profissionais especializados na sua área de atuação.\n(B) excluir do processo a parcela mais carente da população.\n(C) seguir a lógica tradicional do mercado de ações.\n(D) ter como objetivo produzir retorno financeiro.\n(E) transformar a sociedade por meio da inovação." },
            { id: 3, answer: "C", text: "3. No trecho \"está relacionado ao ato de empreender ou inovar com o objetivo de alavancar causas sociais e ambientais\" (parágrafo 1), a palavra destacada pode ser substituída, sem prejuízo do sentido do texto, por\n\n(A) comprovar\n(B) defender\n(C) impulsionar\n(D) modificar\n(E) subsidiar" },
            { id: 4, answer: "D", text: "4. No trecho \"Ainda que não exista uma concepção única sobre o empreendedorismo social\" (parágrafo 1), a expressão destacada pode ser substituída, sem prejuízo do sentido do texto, por\n\n(A) À medida que\n(B) Contanto que\n(C) De modo que\n(D) Mesmo que\n(E) Por causa de" },
            { id: 5, answer: "A", text: "5. No trecho \"Ainda que não exista uma concepção única\" (parágrafo 1), a palavra destacada pode ser substituída, sem prejuízo do sentido do texto, por\n\n(A) compreensão\n(B) conciliação\n(C) convivência\n(D) capacidade\n(E) semelhança" },
            { id: 6, answer: "A", text: "6. A palavra destacada atende às exigências de concordância de acordo com a norma-padrão da lingua portuguesa em:\n\n(A) A administração de empresas de tecnologia e o marketing profissional estão envolvidos na promoção de novos negócios na área econômica.\n(B) A assistência social às pessoas carentes e os cuidados com o aparecimento de novas doenças são necessárias para manter a saúde da população.\n(C) A iniciativa de implementar mudanças nas empresas e o sucesso ao alcançar êxito são comemoradas pelos funcionários.\n(D) O financiamento de projetos e a assistência aos necessitados, desejadas pelos empreendedores sociais, precisam da atenção redobrada dos responsáveis.\n(E) A vacinação de toda a população e a intensificação dos estudos sobre a pandemia devem ser implementados pelas autoridades." },
            { id: 7, answer: "E", text: "7. No trecho \"os empreendimentos sociais analisam seu desempenho\" (parágrafo 2), a palavra destacada se refere a\n\n(A) problema\n(B) comunidade\n(C) daquele grupo\n(D) retorno financeiro\n(E) empreendimentos sociais" },
            { id: 8, answer: "B", text: "8. De acordo com a norma-padrão da língua portuguesa, o uso do acento grave indicativo da crase é obrigatório na palavra destacada em:\n\n(A) A descrição detalhada de um empreendimento a ser realizado é uma necessidade para a aprovação de sua realização.\n(B) A divulgação do concurso levou muitas pessoas a se candidatarem a vaga mais concorrida na empresa.\n(C) A tentativa de obter a isenção fiscal é buscada a todo custo pelos responsáveis da instituição.\n(D) O sucesso de uma empresa deve ser atribuído a gestores competentes.\n(E) O uso de recursos digitais levou os jovens estudiosos a uma nova forma de aprendizagem em diferentes áreas." },
            { id: 9, answer: "B", text: "9. O emprego da vírgula atende às exigências da norma-padrão da língua portuguesa em:\n\n(A) A execução de novas tarefas em um supermercado, envolve a disposição dos funcionários de aceitarem as mudanças propostas pelo RH.\n(B) Ao consultar os fornecedores de produtos para suas lojas, os responsáveis por esse departamento devem ser cuidadosos.\n(C) A escolha do funcionário para proferir uma palestra em nome da empresa, compete à administração da instituição.\n(D) O profissional interessado em mudanças na sua área de atuação deve estudar, com antecedência as suas possibilidades de crescimento.\n(E) Para desenvolver projetos cabe ao gerente da organização, a iniciativa de implementar novas técnicas à disposição dos empreendedores." },
            { id: 10, answer: "D", text: "10. O pronome obliquo destacado foi colocado na posição correta, segundo as exigências da norma-padrão da lingua portuguesa, em:\n\n(A) A área da saúde não encontra-se atendida em regiões afastadas dos grandes centros urbanos nem em comunidades que vivem nas periferias das cidades.\n(B) A preocupação com o meio ambiente tem sido um dos segmentos mais relevantes do empreendedorismo social, porque destina-se a transformar positivamente a sociedade.\n(C) Governantes que têm como missão viabilizar o acesso universal à educação pública de qualidade sempre preocupam-se com ações de inovação e empreendedorismo.\n(D) Para uma iniciativa de empreendedorismo destinada à formação de educadores tornar-se produtiva, é preciso identificar as necessidades do público-alvo de cada comunidade.\n(E) Quando os profissionais que atuam na área de empreendedorismo social sentem-se desanimados, é preciso que eles avaliem todo o progresso que ajudaram a desenvolver." },

            // LÍNGUA INGLESA
            { id: 11, answer: "A", text: "11. The main purpose of the text is to\n\n(A) present a brief history of money.\n(B) relate the history of money with wars.\n(C) regret society's attitude regarding money.\n(D) deny the importance of money to humankind.\n(E) describe the relevance of money in the world." },
            { id: 12, answer: "D", text: "12. In the fragment in the fourth paragraph of the text, \"It was the Lydians, around 600 BC, who get credit for a critical step in this process: fashioning the first known coins, which were made of a gold and silver alloy\" the words in bold refer respectively to:\n\n(A) BC - coins\n(B) 600 BC-first\n(C) 600 BC coins\n(D) Lydians coins\n(E) Lydians-known" },
            { id: 13, answer: "B", text: "13. In the sixth paragraph of the text, the author mentions that paper money first circulated in\n\n(A) Italy\n(B) China\n(C) England\n(D) Australia\n(E) Germany" },
            { id: 14, answer: "E", text: "14. In the fragment in the seventh paragraph of the text \"One of the problems, though, was that counterfeiters had great success with paper bills\", the word in bold is associated with the idea of\n\n(A) time\n(B) addition\n(C) condition\n(D) emphasis\n(E) opposition" },
            { id: 15, answer: "D", text: "15. In the tenth paragraph, the author of the text predicts that there are chances artificial intelligence will be able to\n\n(A) manage bank accounts.\n(B) prevent money changes.\n(C) eliminate exchange rates.\n(D) control financial resources.\n(E) avoid inflation and corruption." },

            // MATEMÁTICA
            { id: 16, answer: "A", text: "16. Um grande banco formará uma comissão que será comandada por três de suas funcionárias, Alice, Beatriz e Carla... Nessas circunstâncias, os respectivos cargos de Alice, Beatriz e Carla serão\n\n(A) gerente, coordenadora e presidente\n(B) gerente, presidente e coordenadora\n(C) coordenadora, presidente e gerente\n(D) presidente, gerente e coordenadora\n(E) presidente, coordenadora e gerente" },
            { id: 17, answer: "E", text: "17. Uma fábrica vende mensalmente 200 malas a R$ 300,00 cada... Nesse mês, com a venda dessas malas, o valor y, em reais, arrecadado, em função de x, é dado por\n\n(A) y = -200x^2 - 5800x + 63600\n(B) y = -200x^2 - 4000x + 63600\n(C) y = -200x^2 - 5800x + 60000\n(D) y = -200x^2 - 4800x + 60800\n(E) y = -200x^2 - 4000x + 60000" },
            { id: 18, answer: "B", text: "18. No primeiro dia de agosto, foram registradas 180 reclamações... durante todos os 31 dias do mês de agosto, o total de reclamações registradas será igual a\n\n(A) 7.108\n(B) 7.440\n(C) 7.860\n(D) 8.184\n(E) 8.880" },
            { id: 19, answer: "B", text: "19. Em um pacote, há algumas cédulas de R$ 10,00, algumas de R$ 20,00, algumas de R$ 50,00 e nada mais... Nesse pacote, o número de cédulas de R$ 10,00 é igual a\n\n(A) 26\n(B) 31\n(C) 37\n(D) 39\n(E) 42" },
            { id: 20, answer: "D", text: "20. Agora, são H horas e M minutos. Considerando-se apenas as 24 horas do dia de hoje, 3/7 do tempo que já se passou correspondem exatamente ao tempo que falta para a meia-noite. Dessa forma, H + M é igual a\n\n(A) 19\n(B) 24\n(C) 37\n(D) 64\n(E) 96" },

            // ATUALIDADES
            { id: 21, answer: "A", text: "21. A principal característica dos bancos exclusivamente digitais é a\n\n(A) oferta de produtos e serviços por meio digital.\n(B) oferta de serviços por meio de agências bancárias.\n(C) oferta de todos os serviços operados pelos bancos múltiplos.\n(D) ausência de operações com moeda estrangeira.\n(E) cobrança de taxas similares às cobradas pelos bancos tradicionais." },
            { id: 22, answer: "D", text: "22. No Sistema Financeiro Nacional, identificam-se os bancos-sombra (shadow banks) como bancos que\n\n(A) possuem diversos tipos de carteiras em suas operações ativas.\n(B) se especializam em transações financeiras como bancos estrangeiros.\n(C) se concentram em transações financeiras no mercado local.\n(D) realizam operações financeiras à margem do sistema de regulação e supervisão do Banco Central do Brasil.\n(E) se originam a partir de indivíduos que se associam para prestar serviços financeiros a seus associados." },
            { id: 23, answer: "E", text: "23. Ao longo das crises financeiras agudas... Nesse contexto, a moeda assume, precipuamente, a função de\n\n(A) meio de financiamento dos investimentos\n(B) meio de troca\n(C) unidade de conta\n(D) escambo\n(E) reserva de valor" },
            { id: 24, answer: "B", text: "24. A economia digital propiciou a criação de um modelo de negócios... A plataforma digital descrita acima é denominada\n\n(A) startup\n(B) marketplace\n(C) fintech\n(D) mobile banking\n(E) internet banking" },
            { id: 25, answer: "A", text: "25. No sistema financeiro contemporâneo, o uso de tecnologias blockchain é considerado revolucionário, porque\n\n(A) possibilita o armazenamento e compartilhamento de dados de forma distribuída, criptografada e sem a intermediação de terceiros.\n(B) envolve múltiplos intermediários financeiros, mas mantém a centralização das informações em apenas um deles.\n(C) permite a quebra do sigilo inerente às transações financeiras.\n(D) elimina as práticas ilegais em curso nas transações financeiras, por meio do uso de linguagem criptografada.\n(E) privilegia a linguagem analógica, em detrimento da digital." },

            // PROBABILIDADE E ESTATÍSTICA
            { id: 26, answer: "A", text: "26. A distribuição das alturas dos atletas de vôlei de uma determinada seleção é normal... O desvio padrão, em centímetros, dessa distribuição é de, aproximadamente,\n\n(A) 2\n(B) 4\n(C) 8\n(D) 16\n(E) 64" },
            { id: 27, answer: "C", text: "27. Uma população é formada por quatro números... a variância da distribuição amostral das médias é de\n\n(A) 3,50\n(B) 4,94\n(C) 12,25\n(D) 24,50\n(E) 32,67" },
            { id: 28, answer: "E", text: "28. Após uma festa de casamento, a anfitriã percebeu que foram esquecidos quatro telefones celulares... A probabilidade de que apenas um desses quatro convidados tenha recebido o seu próprio celular é de\n\n(A) 3/4\n(B) 2/3\n(C) 1/2\n(D) 3/8\n(E) 1/3" },
            { id: 29, answer: "D", text: "29. Considere que, em uma agência bancária, o tempo médio que um cliente aguardou... O tempo médio de espera para um cliente começar a ser atendido no caixa, considerando essas duas semanas, foi de, aproximadamente,\n\n(A) 5min 50s\n(B) 6min 30s\n(C) 6min 50s\n(D) 7min 30s\n(E) 7min 50s" },
            { id: 30, answer: "C", text: "30. Para melhorar a educação financeira de seus clientes... Nesse contexto, se um cliente entrou no cheque especial, a probabilidade de que seja do tipo A, é de, aproximadamente,\n\n(A) 65%\n(B) 70%\n(C) 77%\n(D) 82%\n(E) 85%" },

            // CONHECIMENTOS BANCÁRIOS
            { id: 31, answer: "B", text: "31. Ao decidir pela aplicação em um ativo financeiro... o índice da taxa de juros real ex-ante para os próximos 12 meses é entendido como o índice da\n\n(A) SELIC nominal esperada... variação cambial esperada\n(B) SELIC nominal esperada... inflação esperada\n(C) SELIC nominal acumulada... variação cambial acumulada\n(D) SELIC nominal acumulada... inflação acumulada\n(E) SELIC nominal acumulada... impostos acumulados" },
            { id: 32, answer: "B", text: "32. As operações diárias de compra e venda de divisas estrangeiras... são parte integrante do mercado\n\n(A) monetário\n(B) cambial\n(C) acionário\n(D) crediticio\n(E) de trabalho" },
            { id: 33, answer: "C", text: "33. A equação da paridade dos juros, a descoberto, estabelece que... para que os influxos de capitais estrangeiros no Brasil voltem a se estabilizar, será necessário\n\n(A) aumentar o risco-país.\n(B) aumentar a taxa de juros externa.\n(C) aumentar a taxa de juros interna.\n(D) reduzir a taxa de juros interna.\n(E) depreciar o Real brasileiro..." },
            { id: 34, answer: "A", text: "34. Considere-se a execução, em determinado ano, do orçamento público consolidado do Brasil... o governo brasileiro terá fechado o ano com\n\n(A) déficit fiscal primário\n(B) déficit fiscal nominal\n(C) superávit fiscal primário\n(D) superávit fiscal nominal\n(E) orçamento equilibrado" },
            { id: 35, answer: "E", text: "35. Um pesquisador na área de finanças públicas e privadas atua, também, como consultor... diversas instituições financeiras, dentre as quais administradoras de\n\n(A) imóveis urbanos\n(B) locação de móveis\n(C) empréstimo de automóveis\n(D) bens antigos de raridade comprovada\n(E) mercado de balcão organizado" },

            // TECNOLOGIA DA INFORMAÇÃO
            { id: 36, answer: "E", text: "36. Python/Scikit-learn: Um programador quer obter os parâmetros a e b da equação y=ax+b... Qual linha de código deve substituir o comentário # a fazer de modo a realizar essa regressão linear?\n\n(A) model = skl.lr().fit(x, y)\n(B) model = skl.lr(x, y)\n(C) model = skl.LinearRegression(x, y)\n(D) model = skl.LinearRegression([x, y])\n(E) model = skl.LinearRegression().fit(x, y)" },
            { id: 37, answer: "D", text: "37. Swift: Para isso, o programador deve utilizar o seguinte fragmento de código Swift:\n\n(A) let saida := \"valor total = \\(quantidade*valor)\"\n(B) let saida:= \"valor total = {quantidade*valor}\"\n(C) let saida = \"valor total = %[quantidade*valor]\"\n(D) let saida = \"valor total = \\(quantidade*valor)\"\n(E) let saida = \"valor total = \\[quantidade*valor]\"" },
            { id: 38, answer: "B", text: "38. Java: Nesse cenário, com que fragmento de código o programador deve começar, de forma correta, a implementação da classe?\n\n(A) class MemoriaCalculovenda extends MemoriaCalculo\n(B) class MemoriaCalculoVenda implements MemoriaCalculo\n(C) class MemoriaCalculoVenda imports MemoriaCalculo\n(D) class MemoriaCalculoVenda inherits MemoriaCalculo\n(E) class MemoriaCalculoVenda uses MemoriaCalculo" },

        const TOTAL_QUESTIONS = questions.length;
        const quizContainer = document.getElementById('quiz-container');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const resetBtn = document.getElementById('reset-btn');
        const questionCounterEl = document.getElementById('question-counter');

        const correctCountEl = document.getElementById('correct-count');
        const incorrectCountEl = document.getElementById('incorrect-count');
        const blankCountEl = document.getElementById('blank-count');
        const scorePercentEl = document.getElementById('score-percent');

        let currentQuestionIndex = 0;
        let userAnswers = new Array(TOTAL_QUESTIONS).fill(null);

        function renderQuestion(index) {
            quizContainer.innerHTML = '';
            const q = questions[index];
            const userAnswer = userAnswers[index];
            const isAnswered = userAnswer !== null;

            const card = document.createElement('div');
            card.className = `glass-card p-6 md:p-8 rounded-2xl shadow-xl ${isAnswered ? 'answered' : ''}`;

            // Cabeçalho da Questão
            const header = document.createElement('div');
            header.className = 'flex justify-between items-start mb-6';

            const title = document.createElement('h3');
            title.className = 'text-lg font-bold text-blue-900';
            title.textContent = `Questão ${q.id}`;

            // Badge de Feedback
            const feedback = document.createElement('span');
            feedback.className = 'px-3 py-1 rounded-full text-xs font-bold hidden';
            if (isAnswered) {
                feedback.style.display = 'inline-block';
                if (userAnswer === q.answer) {
                    feedback.textContent = 'CORRETA';
                    feedback.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700 border border-green-200';
                } else {
                    feedback.textContent = `INCORRETA (Gabarito: ${q.answer})`;
                    feedback.className = 'px-3 py-1 rounded-full text-xs font-bold bg-red-100 text-red-700 border border-red-200';
                }
            }

            header.appendChild(title);
            header.appendChild(feedback);
            card.appendChild(header);

            // Texto da Questão
            const text = document.createElement('div');
            text.className = 'question-text text-gray-800 text-base md:text-lg leading-relaxed mb-8';
            text.textContent = q.text;
            card.appendChild(text);

            // Botões de Resposta (A, B, C, D, E)
            const optionsContainer = document.createElement('div');
            optionsContainer.className = 'grid grid-cols-5 gap-2 sm:gap-4';

            ['A', 'B', 'C', 'D', 'E'].forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.className = 'answer-btn py-3 rounded-lg text-lg shadow-sm';
                btn.dataset.option = opt;

                // Estados visuais
                if (userAnswer === opt) btn.classList.add('selected');
                if (isAnswered) {
                    btn.disabled = true;
                    if (opt === q.answer) btn.classList.add('correct-answer');
                    if (userAnswer === opt && opt !== q.answer) btn.classList.add('incorrect-answer');
                } else {
                    btn.addEventListener('click', () => handleAnswer(index, opt));
                }

                optionsContainer.appendChild(btn);
            });

            card.appendChild(optionsContainer);
            quizContainer.appendChild(card);

            updateNavigation();
        }

        function handleAnswer(index, selectedOption) {
            if (userAnswers[index] !== null) return; // Já respondeu

            userAnswers[index] = selectedOption;
            renderQuestion(index); // Re-renderiza para mostrar feedback
            updateScore();
        }

        function updateNavigation() {
            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === TOTAL_QUESTIONS - 1;
            questionCounterEl.textContent = `Questão ${currentQuestionIndex + 1} de ${TOTAL_QUESTIONS}`;
        }

        function updateScore() {
            let correct = 0;
            let incorrect = 0;
            let blank = 0;

            userAnswers.forEach((ans, idx) => {
                if (ans === null) {
                    blank++;
                } else if (ans === questions[idx].answer) {
                    correct++;
                } else {
                    incorrect++;
                }
            });

            correctCountEl.textContent = correct;
            incorrectCountEl.textContent = incorrect;
            blankCountEl.textContent = blank;

            const totalAnswered = correct + incorrect;
            const percent = totalAnswered === 0 ? 0 : Math.round((correct / totalAnswered) * 100);
            scorePercentEl.textContent = `${percent}%`;
        }

        function resetSimulado() {
            if (confirm("Tem certeza? Todo o progresso será perdido.")) {
                userAnswers.fill(null);
                currentQuestionIndex = 0;
                updateScore();
                renderQuestion(0);
            }
        }

        // Listeners
        prevBtn.addEventListener('click', () => {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion(currentQuestionIndex);
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < TOTAL_QUESTIONS - 1) {
                currentQuestionIndex++;
                renderQuestion(currentQuestionIndex);
            }
        });

        resetBtn.addEventListener('click', resetSimulado);

        // Init
        renderQuestion(0);
        updateScore();

    </script>
