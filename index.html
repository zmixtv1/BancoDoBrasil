    <style>
        html, body { height: 100%; margin: 0; font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); color: #e0e0e0; }
        
        .main-layout { display: flex; flex-direction: column; width: 100%; min-height: 100vh; }
        @media (min-width: 1024px) {
            .main-layout { flex-direction: row; }
            .main-content { flex: 1; height: 100vh; overflow-y: auto; }
            .sidebar { width: 400px; flex-shrink: 0; height: 100vh; overflow-y: auto; position: sticky; top: 0; border-left: 1px solid rgba(255, 255, 255, 0.1); }
        }

        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); -webkit-backdrop-filter: blur(15px); }
        .sidebar { background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); }
        .progress-bar-fill { transition: width 0.5s ease-in-out; }
        
        .custom-checkbox { appearance: none; -webkit-appearance: none; height: 24px; width: 24px; background-color: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 6px; cursor: pointer; display: inline-block; position: relative; transition: all 0.2s ease; }
        .custom-checkbox:checked { background-color: #facc15; border-color: #ca8a04; } 
        .custom-checkbox:checked::after { content: ''; position: absolute; left: 7px; top: 3px; width: 6px; height: 12px; border: solid black; border-width: 0 3px 3px 0; transform: rotate(45deg); }
        
        .task-label:has(.custom-checkbox:checked) h3,
        .task-label:has(.custom-checkbox:checked) p { text-decoration: line-through; color: #6b7280; opacity: 0.6; }

        .pomodoro-mode-btn.active { background-color: #facc15; color: black; font-weight: bold; }
        input[type="number"] { -moz-appearance: textfield; }
        input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        /* Animações */
        @keyframes burn { 0% { transform: scale(1); filter: brightness(100%); } 50% { transform: scale(1.1); filter: brightness(120%); } 100% { transform: scale(1); filter: brightness(100%); } }
        .fire-anim { animation: burn 1.5s infinite ease-in-out; }
        @keyframes heartbeat { 0% { transform: scale(1); } 25% { transform: scale(1.1); } 50% { transform: scale(1); } 100% { transform: scale(1); } }
        .heart-anim { animation: heartbeat 2s infinite; }
        
        /* Highlight para matérias fracas */
        .weak-spot { border-left: 4px solid #ef4444 !important; background: rgba(239, 68, 68, 0.1); }
        
        /* Tag de Video */
        .video-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(220, 38, 38, 0.2); color: #fca5a5; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border: 1px solid rgba(220, 38, 38, 0.3); }
        .ti-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(59, 130, 246, 0.2); color: #93c5fd; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border: 1px solid rgba(59, 130, 246, 0.3); }
        .bonus-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(34, 197, 94, 0.2); color: #86efac; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border: 1px solid rgba(34, 197, 94, 0.3); }
        .aktu-tag { display: inline-flex; align-items: center; gap: 4px; background: rgba(168, 85, 247, 0.2); color: #d8b4fe; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; border: 1px solid rgba(168, 85, 247, 0.3); }

</head>

<body class="antialiased">

                    <p class="text-xs text-blue-400 mt-1 font-bold uppercase tracking-widest">Início: 29/12/2025</p>

                    </div>

                                    <p class="text-sm text-gray-400 mt-1 border-l-2 border-blue-500/30 pl-3 italic" id="detail-bloco2">...</p>

                </main>

        // --- CONFIGURAÇÃO DE DATAS ---
        const targetStartDate = new Date(2025, 11, 29);

        let savedStartDate = localStorage.getItem('bb-start-date');

        if (!savedStartDate) {
            savedStartDate = targetStartDate.toISOString();
            localStorage.setItem('bb-start-date', savedStartDate);
        } else {
            const currentSavedDate = new Date(savedStartDate);
            currentSavedDate.setHours(0,0,0,0);
            if (currentSavedDate.getTime() !== targetStartDate.getTime()) {
                savedStartDate = targetStartDate.toISOString();
                localStorage.setItem('bb-start-date', savedStartDate);
            }
        }
        const startDate = new Date(savedStartDate);
        startDate.setHours(0,0,0,0);
        const totalProgramDays = 120;

                { title: "Aula 05: Interpretação Cebraspe IV", detail: "▶️ Vídeo (24min): Fechamento interpretação Cebraspe." },
                { title: "Aula 06: Interpretação Cebraspe V", detail: "▶️ Vídeo (34min): Mais exercícios práticos." },
                { title: "Aula 07: Interpretação Cebraspe VI", detail: "▶️ Vídeo (39min): Revisão de interpretação." },
                { title: "Aula 08: Interpretação Múltipla Escolha I", detail: "▶️ Vídeo (31min): Foco em questões ABCDE." },
                { title: "Aula 09: Interpretação Múltipla Escolha II", detail: "▶️ Vídeo (28min): Resolução de provas anteriores." },
                { title: "Aula 10: Interpretação Múltipla Escolha III", detail: "▶️ Vídeo (34min): Continuação exercícios." },
                { title: "Aula 11: Interpretação Múltipla Escolha IV", detail: "▶️ Vídeo (45min): Questões avançadas." },
                { title: "Aula 12: Interpretação Múltipla Escolha V", detail: "▶️ Vídeo (46min): Simulado final de interpretação." }
            ],
            // Disciplina: Redação Discursiva (12 Aulas Mapeadas)
            redacao: [
                { title: "Aula 01: O Texto Dissertativo", detail: "▶️ Vídeo (32min): O que é um Texto Dissertativo Argumentativo." },
                { title: "Aula 02: Estrutura do Texto", detail: "▶️ Vídeo (32min): Como Estruturar o Texto Argumentativo." },
                { title: "Aula 03: Elaboração da Dissertação", detail: "▶️ Vídeo (31min): Como Elaborar Uma Dissertação Argumentativa." },
                { title: "Aula 04: Introdução e Conclusão", detail: "▶️ Vídeo (30min): Como Elaborar os Parágrafos de Introdução e de Conclusão." },
                { title: "Aula 05: Desenvolvimento", detail: "▶️ Vídeo (32min): Como Elaborar os Parágrafos de Desenvolvimento." },
                { title: "Aula 06: Solidez na Argumentação", detail: "▶️ Vídeo (33min): Como Dar Solidez Às Ideias da Argumentação." },
                { title: "Aula 07: Apresentação e Referências", detail: "▶️ Vídeo (33min): Critérios de Apresentação e de Referências no Texto." },
                { title: "Aula 08: Aspectos Gramaticais I", detail: "▶️ Vídeo (31min): Aspectos Gramaticais e de Linguagem." },
                { title: "Aula 09: Aspectos Gramaticais II", detail: "▶️ Vídeo (30min): Continuação Aspectos Gramaticais." },
                { title: "Aula 10: Aspectos Gramaticais III", detail: "▶️ Vídeo (28min): Fechamento Aspectos Gramaticais." },
                { title: "Aula 11: Análise de Redações", detail: "▶️ Vídeo (32min): Análise de Redações Elaboradas (Exemplos Práticos)." },
                { title: "Aula 12: Considerações Finais", detail: "▶️ Vídeo (29min): Dicas finais para a prova de redação." }
            ],
            // Disciplina: Língua Inglesa (12 Aulas Mapeadas)
            ingles: [
                { title: "Aula 01: Ortografia - Apresentação", detail: "▶️ Vídeo (31min): Apresentação e Ortografia." },
                { title: "Aula 02: Ortografia - Acentuação", detail: "▶️ Vídeo (35min): Regras de acentuação." },
                { title: "Aula 03: Ortografia - Exercícios", detail: "▶️ Vídeo (51min): Resolução de questões de acentuação." },
                { title: "Aula 04: Ortografia - Hífen", detail: "▶️ Vídeo (32min): Uso do hífen." },
                { title: "Aula 05: Ortografia - Hífen Exercícios", detail: "▶️ Vídeo (27min): Prática sobre hífen." },
                { title: "Aula 06: Morfologia I", detail: "▶️ Vídeo (25min): Introdução à Morfologia." },
                { title: "Aula 07: Morfologia II", detail: "▶️ Vídeo (43min): Classes de palavras (aprofundamento)." },
                { title: "Aula 08: Morfologia III", detail: "▶️ Vídeo (46min): Continuação classes de palavras." },
                { title: "Aula 09: Morfologia IV", detail: "▶️ Vídeo (41min): Análise morfológica." },
                { title: "Aula 10: Morfologia Exercícios", detail: "▶️ Vídeo (52min): Questões de morfologia." },
                { title: "Aula 11: Introdução à Sintaxe", detail: "▶️ Vídeo (34min): Conceitos básicos de sintaxe." },
                { title: "Aula 12: Sujeito", detail: "▶️ Vídeo (38min): Tipos de sujeito e concordância." }
            ],
            // Disciplina: Matemática (4 Aulas Mapeadas)
            matematica: [
                { title: "Aula 01: Números e Proporções", detail: "▶️ Vídeo: Números inteiros, racionais e reais; contagem; Razões e proporções; regra de três." },
                { title: "Aula 02: Funções e Matrizes", detail: "▶️ Vídeo: Medidas, conjuntos, funções (polinomiais, exponenciais, logarítmicas) e Matrizes." },
                { title: "Aula 03: Determinantes", detail: "▶️ Vídeo: Estudo de Determinantes." },
                { title: "Aula 04: Sistemas e Sequências", detail: "▶️ Vídeo: Sistemas lineares, Sequências (PA e PG) e Lógica Proposicional." }
            ],
            inteligencia_emocional: [
                { title: "Inteligência Emocional", detail: "🧘 Vídeo Bônus: Gestão de estresse e soft skills." }
            ],
            reprise: [
                { title: "Reprise Eventos", detail: "📺 Revisão: Maratonar aulões de revisão do GranCursos." }
            ]
        };

        // --- GERADOR DE CRONOGRAMA INTELIGENTE ---
        function generateSchedule() {
            const days = [];
            let currentDate = new Date(startDate);
            
            // Índices de Controle
            let idxStat = 0, idxTI = 0, idxBank = 0, idxPort = 0, idxIng = 0, idxMat = 0, idxAtu = 0, idxRed = 0, idxIE = 0, idxRep = 0;

            for (let i = 0; i < totalProgramDays; i++) {
                const dateStr = currentDate.toLocaleDateString('pt-BR');
                const weekDay = currentDate.toLocaleDateString('pt-BR', { weekday: 'long' });
                const weekDayCap = weekDay.charAt(0).toUpperCase() + weekDay.slice(1);
                
                let morning, afternoon, phase;
                const dayOfWeek = currentDate.getDay(); // 0=Dom, 6=Sab

                if (dayOfWeek === 0) { // Domingo
                    phase = "Domingo de Revisão";
                    morning = topics.reprise[idxRep % topics.reprise.length];
                    afternoon = { title: "Planejamento Semanal", detail: "Organizar a agenda da próxima semana." };
                    idxRep++;
                } 
                else if (dayOfWeek === 6) { // Sábado (Dia de temas diversos)
                    phase = "Sábado Diversificado";
                    // Manhã: Agora roda a playlist de Atualidades
                    morning = topics.atualidades[idxAtu % topics.atualidades.length];
                    morning.isAtualidades = true;
                    
                    // Tarde: Inteligência Emocional
                    afternoon = topics.inteligencia_emocional[idxIE % topics.inteligencia_emocional.length];
                    
                    // Quinzenalmente: Redação
                    if (i % 14 === 5) { 
                        afternoon = topics.redacao[idxRed % topics.redacao.length];
                        afternoon.isRedacao = true; // Tag nova
                        idxRed++;
                    }
                    
                    idxAtu++; idxIE++;
                }
                else {
                    // Dias de Semana (Seg-Sex)
                    phase = "Foco: Estatística & TI";

                    // MANHÃ: Prioridade para Estatística (3x) e Bancários/Matemática (2x)
                    if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 5) { // Seg, Qua, Sex
                        morning = topics.estatistica[idxStat % topics.estatistica.length];
                        morning.isWeakSpot = true; 
                        if(dayOfWeek === 1) idxStat++; 
                        idxStat++; 
                    } else { // Ter, Qui
                        // Alterna entre Bancários e Matemática
                        if (dayOfWeek === 2) {
                            morning = topics.bancarios[idxBank % topics.bancarios.length];
                            idxBank++;
                        } else {
                            morning = topics.matematica[idxMat % topics.matematica.length];
                            idxMat++;
                        }
                    }

                    // TARDE: Carrossel de Manutenção
                    if (dayOfWeek === 1 || dayOfWeek === 3 || dayOfWeek === 5) {
                        afternoon = topics.ti[idxTI % topics.ti.length];
                        afternoon.isTI = true;
                        idxTI++;
                    } else if (dayOfWeek === 2) {
                        // Terça à Tarde: Playlist de Português
                        afternoon = topics.portugues[idxPort % topics.portugues.length];
                        idxPort++;
                    } else if (dayOfWeek === 4) {
                        // Quinta à Tarde: Playlist de Inglês
                        afternoon = topics.ingles[idxIng % topics.ingles.length];
                        idxIng++;
                    }
                }

                days.push({ date: dateStr, weekday: weekDayCap, morning, afternoon, phase, dayNum: i + 1 });
                currentDate.setDate(currentDate.getDate() + 1);
            }
            return days;
        }

        const schedule = generateSchedule();

        // --- UI & GAMIFICAÇÃO (Mantido) ---
        function initGamification() {
            let streak = parseInt(localStorage.getItem('bb-streak-count') || '0');
            let lives = parseInt(localStorage.getItem('bb-lives') || '3');
            document.getElementById('streak-counter').textContent = streak;
            document.getElementById('lives-counter').textContent = lives;
            if(streak > 0) document.getElementById('fire-icon').classList.remove('grayscale', 'opacity-50');
        }

        function registerActivity() {
            const today = new Date().toLocaleDateString('pt-BR');
            const last = localStorage.getItem('bb-last-study-date');
            if(last !== today) {
                let s = parseInt(localStorage.getItem('bb-streak-count')||'0') + 1;
                localStorage.setItem('bb-streak-count', s);
                localStorage.setItem('bb-last-study-date', today);
                document.getElementById('streak-counter').textContent = s;
                document.getElementById('fire-icon').classList.remove('grayscale', 'opacity-50');
                document.getElementById('fire-icon').classList.add('fire-anim');
            }
        }

        let currentDayIndex = 0;
        function updateUI(index) {
            const day = schedule[index];
            document.getElementById('day-of-week').textContent = day.weekday;
            document.getElementById('date').textContent = day.date;
            document.getElementById('phase-label').textContent = day.phase;
            document.getElementById('days-count').textContent = `Dia #${day.dayNum}`;
            
            const t1 = document.getElementById('task-bloco1');
            const d1 = document.getElementById('detail-bloco1');
            const l1 = document.getElementById('label-bloco1');
            
            t1.textContent = day.morning.title;
            d1.textContent = day.morning.detail;
            
            // Lógica de Tags Manhã
            if(day.morning.isWeakSpot) {
                l1.classList.add('weak-spot');
                d1.innerHTML = `<span class="video-tag">▶️ VÍDEO PRIORITÁRIO</span><br>` + day.morning.detail.replace("▶️ Vídeo", "");
            } else if (day.morning.isAtualidades) {
                l1.classList.remove('weak-spot');
                d1.innerHTML = `<span class="aktu-tag">📰 ATUALIDADES</span><br>` + day.morning.detail;
            } else if (day.morning.title.includes("Inteligência") || day.morning.title.includes("Reprise")) {
                l1.classList.remove('weak-spot');
                d1.innerHTML = `<span class="bonus-tag">🌟 BÔNUS</span><br>` + day.morning.detail;
            } else {
                l1.classList.remove('weak-spot');
                d1.innerHTML = day.morning.detail;
            }

            const t2 = document.getElementById('task-bloco2');
            const d2 = document.getElementById('detail-bloco2');
            const l2 = document.getElementById('label-bloco2');

            t2.textContent = day.afternoon.title;
            d2.textContent = day.afternoon.detail;

            // Lógica de Tags Tarde
            if(day.afternoon.isTI) {
                d2.innerHTML = `<span class="ti-tag">💻 PRÁTICA TI</span><br>` + day.afternoon.detail.replace("▶️ Vídeo", "");
            } else if (day.afternoon.isRedacao) {
                d2.innerHTML = `<span class="bonus-tag">✍️ REDAÇÃO</span><br>` + day.afternoon.detail.replace("▶️ Vídeo", "");
            } else {
                d2.innerHTML = day.afternoon.detail;
            }

            const key = `bb-progress-${day.date.replace(/\//g, '-')}`;
            const saved = JSON.parse(localStorage.getItem(key) || '{"b1":false, "b2":false}');
            document.getElementById('check-bloco1').checked = saved.b1;
            document.getElementById('check-bloco2').checked = saved.b2;
            
            document.getElementById('day-input').value = day.dayNum;
            document.getElementById('prev-btn').disabled = index === 0;
            document.getElementById('next-btn').disabled = index === schedule.length - 1;
            
            calcProgress();
        }

        function saveCheck() {
            const day = schedule[currentDayIndex];
            const c1 = document.getElementById('check-bloco1').checked;
            const c2 = document.getElementById('check-bloco2').checked;
            localStorage.setItem(`bb-progress-${day.date.replace(/\//g, '-')}`, JSON.stringify({ b1: c1, b2: c2 }));
            if(c1 || c2) registerActivity();
            calcProgress();
        }
        
        function calcProgress() {
            let done = 0;
            schedule.forEach(d => {
                const s = JSON.parse(localStorage.getItem(`bb-progress-${d.date.replace(/\//g, '-')}`) || '{"b1":false}');
                if(s.b1) done += 0.5; if(s.b2) done += 0.5;
            });
            const pct = Math.round((done/schedule.length)*100);
            document.getElementById('overall-progress-bar').style.width = `${pct}%`;
            document.getElementById('overall-progress-text').textContent = `${pct}%`;
        }

        function resetScheduleDate() {
            let resets = parseInt(localStorage.getItem('bb-reset-count') || '0');
            if(resets >= 3) { alert("Sem resets disponíveis."); return; }
            if(confirm("Reiniciar para HOJE?")) {
                localStorage.setItem('bb-start-date', new Date().toISOString());
                localStorage.setItem('bb-reset-count', resets + 1);
                location.reload();
            }
        }
        function updateResetUI() {
            let r = parseInt(localStorage.getItem('bb-reset-count')||'0');
            document.getElementById('reset-text').textContent = `Restam ${3-r} realinhamentos`;
            if(r>=3) document.getElementById('reset-btn-action').disabled = true;
        }

        // Listeners
        document.getElementById('check-bloco1').addEventListener('change', saveCheck);
        document.getElementById('check-bloco2').addEventListener('change', saveCheck);
        document.getElementById('prev-btn').onclick = () => { if(currentDayIndex>0) updateUI(--currentDayIndex); };
        document.getElementById('next-btn').onclick = () => { if(currentDayIndex<schedule.length-1) updateUI(++currentDayIndex); };
        document.getElementById('jump-btn').onclick = () => {
            const v = parseInt(document.getElementById('day-input').value)-1;
            if(v>=0 && v<schedule.length) { currentDayIndex=v; updateUI(v); }
        };

        // Timer
        let tId, tLeft=2400, run=false;
        const disp = document.getElementById('timer-display');
        const btnS = document.getElementById('start-pause-btn');
        btnS.onclick = () => {
            if(run) { clearInterval(tId); btnS.textContent="CONTINUAR"; }
            else { tId=setInterval(()=>{ tLeft--; disp.textContent=`${Math.floor(tLeft/60)}:${(tLeft%60).toString().padStart(2,'0')}`; if(tLeft<=0) clearInterval(tId); },1000); btnS.textContent="PAUSAR"; }
            run=!run;
        };
        document.getElementById('reset-btn').onclick = () => { clearInterval(tId); run=false; tLeft=2400; disp.textContent="40:00"; btnS.textContent="INICIAR"; };

        // Init
        initGamification();
        const todayTime = new Date(); todayTime.setHours(0,0,0,0);
        let todayIdx = schedule.findIndex(d => {
            const p = d.date.split('/');
            return new Date(p[2], p[1]-1, p[0]).getTime() === todayTime.getTime();
        });
        if(todayIdx === -1) todayIdx = 0;
        currentDayIndex = todayIdx;
        updateUI(currentDayIndex);
        updateResetUI();

    </script>
